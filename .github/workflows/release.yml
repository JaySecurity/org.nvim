name: Release

# Development happens on dev. main only takes pull requests from
# release/vX.Y.Z branches; merging one tags vX.Y.Z and publishes the GitHub
# release. Its notes are the vX.Y.Z section of CHANGELOG.md, which the
# release branch regenerates with `make changelog` (scripts/changelog.lua);
# GitHub's generated notes (.github/release.yml) are the fallback when the
# section is empty. The tag goes on the release branch's last commit, not
# the merge commit, so dev reaches it once the release branch is merged
# back: org.nvim's version (:Org version) is the latest vX.Y.Z tag of the
# checkout.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, closed]

jobs:
  release-branch:
    name: release branch
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Head branch is release/vX.Y.Z and the tag is new
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::main only accepts pull requests from release/vX.Y.Z branches (got '$HEAD_REF'). Target dev instead."
            exit 1
          fi
          tag="${HEAD_REF#release/}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: CHANGELOG.md has a section for the version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          tag="${HEAD_REF#release/}"
          if ! grep -qF "## [$tag]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$tag]' section. Run 'make changelog' on $HEAD_REF and commit CHANGELOG.md."
            exit 1
          fi

  # The extension promotion report (scripts/extension_report.lua) in the
  # job summary of every release pull request, so each release looks at
  # promoting experimental extensions (CONTRIBUTING.md, "Promoting an
  # extension"). Informational: it never fails. Line coverage comes from
  # the latest Coverage workflow run, when its artifact is still there.
  extensions-report:
    name: extensions report
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # the history and tags: releases since an extension was added and
          # since its last breaking change
          fetch-depth: 0
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Coverage from the latest Coverage run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the latest run that tested dev: one started on dev, or a
          # scheduled one (it runs on main, the default branch, but checks
          # out dev); not one dispatched on another branch
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow coverage.yml --status completed \
            --limit 50 --json databaseId,headBranch,event \
            --jq '[.[] | select(.headBranch == "dev" or .event == "schedule")][0].databaseId // empty' || true)
          if [[ -n "$id" ]]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name coverage --dir coverage || true
          fi
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: make extensions-report ARGS=--markdown | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event.action == 'closed' && github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag, the release and the merge-back branch
      actions: write # to start pages.yml
      pull-requests: write # the merge-back pull request into dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Tag and publish the release
        env:
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${HEAD_REF#release/}"
          # the version's section of CHANGELOG.md without its heading, up to
          # the next version or the link definitions at the end
          awk -v h="## [$tag]" '
            index($0, h) == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if grep -q '[^[:space:]]' notes.md && ! grep -qx 'No changes yet.' notes.md; then
            if [[ -n "$prev" ]]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$prev" "$tag" >> notes.md
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "org.nvim $tag" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "org.nvim $tag" --generate-notes
          fi
      # The release event of a release made with GITHUB_TOKEN doesn't start
      # workflows, so deploy the documentation site from here. It runs on
      # main (which the github-pages environment allows) and builds the tag.
      - name: Deploy the documentation site
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="${HEAD_REF#release/}"
      # Upload the rock to luarocks.org (luarocks.yml), run on the tag so
      # its version is the release's.
      - name: Publish to LuaRocks
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run luarocks.yml --repo "$GITHUB_REPOSITORY" --ref "${HEAD_REF#release/}"
      # Bring the release back into dev: a pull request from
      # merge-back/vX.Y.Z, a branch made here at the release branch's last
      # commit (the tagged one; the release branch itself may be deleted by
      # now). Its `release:` title keeps it out of CHANGELOG.md. Nothing to
      # do when dev already has that commit. Last, and allowed to fail: the
      # release is out either way, and the pull request can be opened by
      # hand (CONTRIBUTING.md, "Branches, CI and releases").
      - name: Open the merge-back pull request into dev
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${HEAD_REF#release/}"
          branch="merge-back/$tag"
          # "behind" or "identical": the release commit is an ancestor of dev
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/dev...$SHA" --jq .status)
          if [[ "$status" == "behind" || "$status" == "identical" ]]; then
            echo "dev already has $SHA ($tag): no merge-back needed."
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$SHA" --silent; then
            # a re-run: the branch is there already, at the same commit
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)
            if [[ "$existing" != "$SHA" ]]; then
              echo "::error::$branch exists at $existing, not at the release commit $SHA."
              exit 1
            fi
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base dev --state open \
            --json url --jq '.[0].url // empty')
          if [[ -n "$open" ]]; then
            echo "The merge-back pull request is open already: $open"
            exit 0
          fi
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            printf 'Brings the `%s` release (its `CHANGELOG.md` section and any fix committed to `%s`) back into `dev`, so `dev` reaches the `%s` tag and `:Org version` reports it there.\n\n' "$tag" "$HEAD_REF" "$tag"
            printf 'Merge it with a merge commit, not a squash, or `dev` will not contain the tagged commit. Resolve conflicts on `%s` (usually in `CHANGELOG.md`: take the release side). Opened by the Release workflow after #%s.\n\n' "$branch" "$NUMBER"
            printf '## In plain words\n\nVersion %s is out. This copies its last changes, such as the list of what changed, back to where development happens, so the next version builds on it. Nothing changes for users.\n' "$tag"
          } > merge-back.md
          # GITHUB_TOKEN may only open pull requests when the repository
          # allows it (Settings > Actions > General > "Allow GitHub Actions
          # to create and approve pull requests")
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$branch" \
            --title "release: merge $tag into dev" --body-file merge-back.md; then
            echo "::warning::Could not open the merge-back pull request; open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/dev...$branch?expand=1 titled 'release: merge $tag into dev'"
            exit 1
          fi
